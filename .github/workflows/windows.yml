# rexxj on Windows (step 3 of the warm JVM's plan, docs/java-from-rexx-design.md):
# a Linux job builds rexxj.jar over the rexx.wasm of the saved build (branch
# saved-build: the C side is not rebuilt here), a Windows job runs tests/windows.
name: windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The saved build's dist, if its C inputs are this checkout's
        run: |
          git fetch -q --depth 1 origin saved-build
          mkdir -p "$RUNNER_TEMP/saved" && git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/saved"
          # what rexx.wasm is made from (scripts/saved-build.sh's MANIFEST); build.sh
          # is left out: it builds the jar and the launchers too
          C=' (0001-[^ ]*\.patch|wasi-p1-threads\.cmake|compat/.*)$'
          grep -E "$C" "$RUNNER_TEMP/saved/MANIFEST" > "$RUNNER_TEMP/saved.c"
          (git ls-files -- 0001-wasi-on-top-of-oorexxwasm-0001.patch wasi-p1-threads.cmake compat \
             | LC_ALL=C sort | xargs sha256sum) | grep -E "$C" > "$RUNNER_TEMP/now.c"
          diff "$RUNNER_TEMP/saved.c" "$RUNNER_TEMP/now.c" \
            || { echo "::error::the saved build is for other C sources: rebuild and publish it"; exit 1; }
          tar -xzf "$RUNNER_TEMP/saved/oorexxjava-dist.tar.gz" dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: rexxj.jar
        run: |
          scripts/endive-compiler.sh
          (cd host && mvn -q -B clean package -DskipTests -Pembedded -Dwasm.file="$GITHUB_WORKSPACE/dist/rexx.wasm")
          cp host/target/rexxj.jar dist/
          cp launchers/windows/*.cmd dist/
      - name: rexxjs.exe, the warm JVM's client (client/rexxjs_win.c), with MinGW-w64
        run: |
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 >/dev/null
          x86_64-w64-mingw32-gcc -O2 -Wall -municode -o dist/rexxjs.exe client/rexxjs_win.c -lws2_32 -static
          x86_64-w64-mingw32-gcc -O2 -Wall -municode -o dist/test-ctrlbreak.exe tests/windows/ctrlbreak.c -static
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
  test:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: tests/windows
        shell: pwsh
        run: tests/windows/run.ps1 dist
      - name: tests/windows through rexxjs.exe (REXXJ_SERVER, the warm JVM)
        shell: pwsh
        run: |
          $d = (Resolve-Path dist).Path      # run.ps1 changes the directory
          $env:REXXJ_SERVER = "1"
          tests/windows/run.ps1 dist
          $rc = $LASTEXITCODE
          # start-up: a warm run against a new JVM's
          $warm = (Measure-Command { & "$d\rexx.cmd" -e "say 'hi'" | Out-Null }).TotalMilliseconds
          $env:REXXJ_SERVER = $null
          $cold = (Measure-Command { & "$d\rexx.cmd" -e "say 'hi'" | Out-Null }).TotalMilliseconds
          "say 'hi': {0:N0} ms through rexxjs, {1:N0} ms with a new JVM" -f $warm, $cold
          # a server must have been running: else rexxjs fell back to rexxj.cmd
          & "$d\rexxjs.exe" --orx-server-stop
          if ($LASTEXITCODE -ne 0) { "::error::no server was running: rexxjs fell back to rexxj.cmd"; $rc = 1 }
          Get-ChildItem $env:TEMP -Filter ".ooRexx-jvm-*.log" -Force | ForEach-Object {
            "---- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          exit $rc
      - name: Endive's WASI and file attributes (host/chicory-reports/endive, StatAttributes)
        shell: bash
        run: |
          cd host/chicory-reports/endive
          mvn -q -B package dependency:build-classpath -Dmdep.outputFile=cp.txt
          java -cp "target/endive-repro-1.jar;$(cat cp.txt)" repro.StatAttributes
